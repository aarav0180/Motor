# ==============================================================================
# Mosquitto MQTT Broker Configuration for Motor Vibration Monitoring
# Supports both native TCP MQTT (Edge Pi) and WebSockets (Web/Mobile Apps)
# ==============================================================================

# Standard TCP listener for Raspberry Pi Edge Daemon
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# WebSocket listener for Browser / PWA / Mobile Web Clients
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Persistence: Retain messages across broker restarts
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
